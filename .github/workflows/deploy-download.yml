name: Deploy bb-download.js
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-download.yml'
      - 'gzparts/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and deploy
        run: |
          cat gzparts/dl_b64_*.txt | base64 -d > bb-download.js
          echo "Deployed bb-download.js"
